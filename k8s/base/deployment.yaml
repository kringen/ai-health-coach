# AI Health Coach Application Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-coach
  labels:
    app: health-coach
    component: webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: health-coach
      component: webapp
  template:
    metadata:
      labels:
        app: health-coach
        component: webapp
    spec:
      containers:
      - name: health-coach
        image: health-coach:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: PORT
          value: "8080"
        - name: DB_DRIVER
          value: "mariadb"
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: health-coach-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: health-coach-config
              key: DB_PORT
        - name: DB_TLS
          valueFrom:
            configMapKeyRef:
              name: health-coach-config
              key: DB_TLS
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: health-coach-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: health-coach-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-secret
              key: password
        - name: AI_PROVIDER
          valueFrom:
            configMapKeyRef:
              name: health-coach-config
              key: AI_PROVIDER
        - name: OLLAMA_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: health-coach-config
              key: OLLAMA_BASE_URL
        - name: OLLAMA_MODEL
          valueFrom:
            configMapKeyRef:
              name: health-coach-config
              key: OLLAMA_MODEL
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: anthropic-api-key
        - name: ANTHROPIC_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: health-coach-config
              key: ANTHROPIC_BASE_URL
        - name: ANTHROPIC_MODEL
          valueFrom:
            configMapKeyRef:
              name: health-coach-config
              key: ANTHROPIC_MODEL
        - name: ANTHROPIC_API_VERSION
          valueFrom:
            configMapKeyRef:
              name: health-coach-config
              key: ANTHROPIC_API_VERSION
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: google-client-id
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: google-client-secret
        - name: GOOGLE_REDIRECT_URL
          valueFrom:
            configMapKeyRef:
              name: health-coach-config
              key: GOOGLE_REDIRECT_URL
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: session-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          seccompProfile:
            type: RuntimeDefault
        livenessProbe:
          httpGet:
            path: /login
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /login
            port: 8080
          periodSeconds: 5
          failureThreshold: 18
