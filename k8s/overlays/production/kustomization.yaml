apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: health-coach-production

resources:
  - ../../base

namespace: health-coach-prod

commonLabels:
  environment: production
  tier: production

images:
  - name: health-coach
    newName: docker.io/kringen/health-coach
    newTag: latest

replicas:
  - name: health-coach
    count: 2

patches:
  - target:
      kind: Deployment
      name: health-coach
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 1000m
  - target:
      kind: Ingress
      name: health-coach-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: tracker.kringen.io
      - op: replace
        path: /spec/tls/0/hosts/0
        value: tracker.kringen.io
